version: 2
project_name: hush

before:
  hooks:
    - sh -c 'mkdir -p completions && for sh in bash zsh fish; do go run . completion $sh > completions/hush.$sh; done'

builds:
  - binary: hush
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{ .Version }}"]

archives:
  - name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files: [completions/*]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

homebrew_casks:
  - name: hush-cli
    binaries: [hush]
    completions:
      bash: completions/hush.bash
      zsh: completions/hush.zsh
      fish: completions/hush.fish
    homepage: https://github.com/hushsecurity/hush-cli
    description: Hush Security command line interface
    repository:
      owner: hushsecurity
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    # The binary isn't notarized: let macOS run it.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/hush"]
          end
