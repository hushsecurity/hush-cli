---
name: Build
on:
  push:
    branches:
      - main
      - "**-ci"
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Git Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Linear PR history
        if: github.event_name == 'pull_request'
        uses: NexusPHP/no-merge-commits@v2.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Lint
        run: make lint && shellcheck install.sh
      - name: Test
        run: make test
      - name: Build
        run: |
          make build && ./hush version
          for os in darwin windows; do GOOS=$os go build -o /dev/null .; done
