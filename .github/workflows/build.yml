---
name: Build
on:
  push:
    branches:
      - main
      - "**-ci"
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Linear PR history
        if: github.event_name == 'pull_request'
        uses: NexusPHP/no-merge-commits@109a3342781ddcf26b2fa739f29e8ee9f68b7d8e # v2.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Build
        run: |
          make build && ./hush version
          for os in darwin windows; do GOOS=$os go build -o /dev/null .; done
